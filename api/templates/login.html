{% extends 'base.html' %}
{% block content %}
<section class="auth-layout">
  <div class="auth-aside">
    <span class="eyebrow">{{ store.business_name }}</span>
    <h1>Welcome back.</h1>
    <p>{{ store.headline }}</p>
  </div>
  <div class="form-card card auth-card">
    <h2>Login</h2>
    <form method="post">
      <div class="field">
        <label for="login-email">Email</label>
        <input class="input" id="login-email" type="email" name="email" autocomplete="email" required {% if client_mode %}disabled{% endif %}>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input class="input" id="login-password" type="password" name="password" autocomplete="current-password" required {% if client_mode %}disabled{% endif %}>
      </div>
      <button class="btn full" type="submit" {% if client_mode %}disabled{% endif %}>Login</button>
    </form>
    <div class="auth-links">
      {% if client_mode %}
        <span class="auth-link-disabled" aria-disabled="true">Forgot password?</span>
        <span class="auth-link-disabled" aria-disabled="true">Create an account</span>
      {% else %}
        <a href="{{ url_for('reset_password') }}">Forgot password?</a>
        <a href="{{ url_for('signup') }}">Create an account</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
